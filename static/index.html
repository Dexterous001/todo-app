<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Todo List</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    :root { --bg:#f3f4f6; --card:#fff; --text:#111827; --muted:#6b7280; --border:#e5e7eb; --input:#fff; --accent:#2563eb; }
    :root[data-theme="dark"] { --bg:#0f172a; --card:#1e293b; --text:#f1f5f9; --muted:#94a3b8; --border:#334155; --input:#0f172a; --accent:#3b82f6; }
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 32px 12px; }
    .card { max-width: 560px; margin: 0 auto; background: var(--card); border-radius: 12px; padding: 24px; box-shadow: 0 2px 10px rgba(0,0,0,.12); }
    .top { display: flex; justify-content: space-between; align-items: center; }
    h1 { margin: 0 0 16px; font-size: 26px; }
    input, select, textarea { font: inherit; padding: 9px; border: 1px solid var(--border); border-radius: 8px; background: var(--input); color: var(--text); }
    button { font: inherit; padding: 9px 14px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; }
    button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--border); padding: 5px 10px; font-size: 14px; }
    button.del { background: #ef4444; padding: 5px 10px; }
    .add { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-bottom: 8px; }
    .add .opts { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; color: var(--muted); font-size: 14px; }
    .tools { display: flex; gap: 8px; margin: 16px 0; flex-wrap: wrap; }
    .tools input { flex: 1; min-width: 140px; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; background: var(--card); }
    li.dragging { opacity: .4; }
    li.done .title { text-decoration: line-through; color: var(--muted); }
    .row { display: flex; align-items: center; gap: 10px; padding: 10px; }
    .row.draggable { cursor: grab; }
    .main { flex: 1; min-width: 0; }
    .title { word-break: break-word; }
    .meta { display: flex; gap: 8px; margin-top: 4px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
    .badge { padding: 1px 8px; border-radius: 999px; color: #fff; text-transform: capitalize; }
    .badge.high { background: #dc2626; } .badge.medium { background: #d97706; } .badge.low { background: #16a34a; }
    .overdue { color: #dc2626; font-weight: 600; }
    .handle { color: var(--muted); }
    .panel { padding: 0 10px 10px; display: grid; gap: 8px; }
    .panel textarea { width: 100%; min-height: 80px; resize: vertical; }
    .panel .opts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .empty, .hint { color: var(--muted); text-align: center; font-size: 14px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const today = () => new Date().toLocaleDateString("en-CA"); // YYYY-MM-DD

    async function api(url, method = "GET", body) {
      const res = await fetch(url, {
        method,
        headers: { "Content-Type": "application/json" },
        body: body ? JSON.stringify(body) : undefined,
      });
      return res.json();
    }

    // The little editor that opens under an item: notes, due date, priority
    function Details({ todo, onSave }) {
      const [notes, setNotes] = useState(todo.notes);
      const [due, setDue] = useState(todo.due_date);
      const [priority, setPriority] = useState(todo.priority);
      return (
        <div className="panel">
          <textarea value={notes} placeholder="Write a note about this task..." onChange={(e) => setNotes(e.target.value)} />
          <div className="opts">
            <label>Due <input type="date" value={due} onChange={(e) => setDue(e.target.value)} /></label>
            <label>Priority{" "}
              <select value={priority} onChange={(e) => setPriority(e.target.value)}>
                <option value="low">Low</option>
                <option value="medium">Medium</option>
                <option value="high">High</option>
              </select>
            </label>
            <button onClick={() => onSave({ notes, due_date: due, priority })}>Save</button>
          </div>
        </div>
      );
    }

    function App() {
      const [todos, setTodos] = useState([]);
      const [text, setText] = useState("");
      const [due, setDue] = useState("");
      const [priority, setPriority] = useState("medium");
      const [search, setSearch] = useState("");
      const [filter, setFilter] = useState("all");
      const [openId, setOpenId] = useState(null);
      const [dragId, setDragId] = useState(null);
      const [dark, setDark] = useState(() => {
        try { return localStorage.getItem("theme") === "dark"; } catch (e) { return false; }
      });

      useEffect(() => {
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        try { localStorage.setItem("theme", dark ? "dark" : "light"); } catch (e) {}
      }, [dark]);

      const load = async () => setTodos(await api("/api/todos"));
      useEffect(() => { load(); }, []);

      const addTodo = async (e) => {
        e.preventDefault();
        if (!text.trim()) return;
        await api("/api/todos", "POST", { text, due_date: due, priority });
        setText(""); setDue(""); setPriority("medium");
        load();
      };
      const update = async (todo, changes) => { await api(`/api/todos/${todo.id}`, "PATCH", changes); load(); };
      const remove = async (todo) => { await api(`/api/todos/${todo.id}`, "DELETE"); load(); };

      const q = search.trim().toLowerCase();
      const visible = todos.filter((t) =>
        (filter === "all" || (filter === "done") === t.done) &&
        (!q || t.text.toLowerCase().includes(q) || t.notes.toLowerCase().includes(q))
      );
      const canDrag = !q && filter === "all"; // moving items only makes sense in the full list

      const drop = (targetId) => {
        if (dragId === null || dragId === targetId) return;
        const list = [...todos];
        const from = list.findIndex((t) => t.id === dragId);
        const to = list.findIndex((t) => t.id === targetId);
        const [moved] = list.splice(from, 1);
        list.splice(to, 0, moved);
        setTodos(list);
        api("/api/todos/order", "PUT", { ids: list.map((t) => t.id) });
        setDragId(null);
      };

      return (
        <div className="card">
          <div className="top">
            <h1>My Todo List</h1>
            <button className="ghost" onClick={() => setDark(!dark)}>{dark ? "☀ Light" : "🌙 Dark"}</button>
          </div>

          <form className="add" onSubmit={addTodo}>
            <input value={text} onChange={(e) => setText(e.target.value)} placeholder="What needs doing?" />
            <button type="submit">Add</button>
            <div className="opts">
              <label>Due <input type="date" value={due} onChange={(e) => setDue(e.target.value)} /></label>
              <label>Priority{" "}
                <select value={priority} onChange={(e) => setPriority(e.target.value)}>
                  <option value="low">Low</option>
                  <option value="medium">Medium</option>
                  <option value="high">High</option>
                </select>
              </label>
            </div>
          </form>

          <div className="tools">
            <input value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Search tasks and notes..." />
            <select value={filter} onChange={(e) => setFilter(e.target.value)}>
              <option value="all">All</option>
              <option value="active">Active</option>
              <option value="done">Done</option>
            </select>
          </div>

          {todos.length === 0 && <p className="empty">Nothing here yet. Add your first item!</p>}
          {todos.length > 0 && visible.length === 0 && <p className="empty">No tasks match your search or filter.</p>}
          {!canDrag && visible.length > 0 && <p className="hint">Clear the search and filter to drag items around.</p>}

          <ul>
            {visible.map((todo) => {
              const open = openId === todo.id;
              const overdue = todo.due_date && !todo.done && todo.due_date < today();
              return (
                <li
                  key={todo.id}
                  className={(todo.done ? "done " : "") + (dragId === todo.id ? "dragging" : "")}
                  draggable={canDrag && !open}
                  onDragStart={() => setDragId(todo.id)}
                  onDragOver={(e) => e.preventDefault()}
                  onDrop={() => drop(todo.id)}
                  onDragEnd={() => setDragId(null)}
                >
                  <div className={"row" + (canDrag && !open ? " draggable" : "")}>
                    {canDrag && <span className="handle">☰</span>}
                    <input type="checkbox" checked={todo.done} onChange={() => update(todo, { done: !todo.done })} />
                    <div className="main">
                      <div className="title">{todo.text}</div>
                      <div className="meta">
                        <span className={"badge " + todo.priority}>{todo.priority}</span>
                        {todo.due_date && <span className={overdue ? "overdue" : ""}>{overdue ? "Overdue: " : "Due "}{todo.due_date}</span>}
                        {todo.notes && <span>📝 has notes</span>}
                      </div>
                    </div>
                    <button className="ghost" onClick={() => setOpenId(open ? null : todo.id)}>{open ? "Close" : "Notes"}</button>
                    <button className="del" onClick={() => remove(todo)}>✕</button>
                  </div>
                  {open && <Details todo={todo} onSave={(changes) => { update(todo, changes); setOpenId(null); }} />}
                </li>
              );
            })}
          </ul>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
